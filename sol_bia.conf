#!name = YouTube + Spotify + Locket + Xingtu Premium
#!desc = Unlock YouTube Premium, Spotify Premium, Locket Gold
#!author = voanhkhoa2507
# Shadowrocket Config - 3 Apps Premium Unlock

[General]
update-url = https://raw.githubusercontent.com/voanhkhoa2507/sdrk/main/sol_bia.conf

[Rule]
# YouTube - Route qua Proxy
DOMAIN-SUFFIX,youtube.com,PROXY
DOMAIN-SUFFIX,googlevideo.com,PROXY
DOMAIN-SUFFIX,ytimg.com,PROXY
DOMAIN-SUFFIX,googleapis.com,PROXY
# Spotify - Route qua Proxy
DOMAIN-SUFFIX,spotify.com,PROXY
DOMAIN-SUFFIX,scdn.co,PROXY
# Locket - Route qua Proxy
DOMAIN-SUFFIX,locketapp.com,PROXY
DOMAIN-SUFFIX,locket.camera,PROXY
DOMAIN-SUFFIX,revenuecat.com,PROXY
# Xingtu (醒图) - Route qua Proxy
DOMAIN-SUFFIX,faceu.mobi,PROXY
# YouTube - Block QUIC/UDP de buoc dung TCP (Shadowrocket chi decrypt duoc TCP)
AND,((DOMAIN-SUFFIX,googlevideo.com),(PROTOCOL,UDP)),REJECT
AND,((DOMAIN,youtubei.googleapis.com),(PROTOCOL,UDP)),REJECT
# Mac dinh: ket noi truc tiep
FINAL,DIRECT

[URL Rewrite]
# YouTube - Chan quang cao video
^https?:\/\/[\w-]+\.googlevideo\.com\/(?!(dclk_video_ads|videoplayback\?)).+&oad _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/api\/stats\/ads _ reject-200
^https?:\/\/(www|s)\.youtube\.com\/(pagead|ptracking) _ reject-200
^https?:\/\/s\.youtube\.com\/api\/stats\/qoe\?adcontext _ reject-200
# YouTube - Xoa tham so ctier=L (unlock chat luong video)
(^https?:\/\/[\w-]+\.googlevideo\.com\/(?!dclk_video_ads).+?)&ctier=L(&.+?),ctier,(.+) $1$2$3 302

[Header Rewrite]
# Locket/RevenueCat - Xoa ETag cache header de buoc server tra full JSON body
http-request ^https?://api.revenuecat.com/.+/(receipts$|subscribers/?(.*?)*$) header-del x-revenuecat-etag
http-request ^https?://api.revenuecat.com/.+/(receipts$|subscribers/?(.*?)*$) header-del X-RevenueCat-ETag
# Spotify - Xoa cache header de bypass 304 Not Modified
http-request ^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/user-customization-service\/v1\/customize$ header-del if-none-match

[Map Local]
# YouTube - Tra ve response trong cho initplayback (chan quang cao)
^https?:\/\/[\w-]+\.googlevideo\.com\/initplayback.+&oad data-type=text data="" status-code=200

[Script]
# ========== YouTube Premium ==========
# Intercept request toi YouTube Innertube API (binary protobuf)
youtube.request = type=http-request,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|reel\/reel_watch_sequence|get_watch),requires-body=1,max-size=-1,binary-body-mode=1,engine=jsc,script-path=https://raw.githubusercontent.com/voanhkhoa2507/sdrk/main/js/youtube.response.js
# Sua response de bat premium flags (background play, no ads, PiP)
youtube.response = type=http-response,pattern=^https:\/\/youtubei\.googleapis\.com\/youtubei\/v1\/(browse|next|player|search|reel\/reel_watch_sequence|guide|account\/get_setting|get_watch),requires-body=1,max-size=-1,binary-body-mode=1,script-path=https://raw.githubusercontent.com/voanhkhoa2507/sdrk/main/js/youtube.response.js,argument="{"lyricLang":"vi","captionLang":"vi","blockUpload":true,"blockImmersive":true,"debug":false}"

# ========== Spotify Premium ==========
# Sua JSON request cho artist/album view (mo khoa full tracklist)
spotify-json = type=http-request,pattern=^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(artistview\/v1\/artist|album-entity-view\/v2\/album)\/,requires-body=0,script-path=https://raw.githubusercontent.com/voanhkhoa2507/sdrk/main/js/spotify-json.js
# Sua protobuf response cho bootstrap/customize (bat premium flags)
spotify-proto = type=http-response,pattern=^https:\/\/(spclient\.wg\.spotify\.com|.*-spclient\.spotify\.com(:443)?)\/(bootstrap\/v1\/bootstrap|user-customization-service\/v1\/customize)$,requires-body=1,binary-body-mode=1,max-size=0,script-path=https://raw.githubusercontent.com/voanhkhoa2507/sdrk/main/js/spotify-proto.js,script-update-interval=0

# ========== Locket Gold ==========
# Sua RevenueCat API response de inject Gold entitlement
revenuecat = type=http-response,pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts$|subscribers\/[^/]+$),requires-body=true,max-size=-1,timeout=60,script-path=https://raw.githubusercontent.com/voanhkhoa2507/sdrk/main/js/Locket.js
# Xoa cache headers truoc khi gui request (buoc server tra full JSON body)
deleteHeader = type=http-request,pattern=^https:\/\/api\.revenuecat\.com\/.+\/(receipts|subscribers),script-path=https://raw.githubusercontent.com/voanhkhoa2507/sdrk/main/js/deleteHeader.js,timeout=60

# ========== Xingtu (醒图) VIP ==========
# Sua API response de mo khoa Xingtu VIP
xingtu = type=http-response,pattern=^https:\/\/commerce-api\.faceu\.mobi\/commerce\/v1\/subscription,requires-body=1,script-path=https://raw.githubusercontent.com/voanhkhoa2507/sdrk/main/js/xingtu.js,timeout=60

[MITM]
enable = true
hostname = %APPEND%, .googlevideo.com, youtubei.googleapis.com, www.youtube.com, s.youtube.com, api.revenuecat.com, spclient.wg.spotify.com, *spclient.spotify.com, commerce-api.faceu.mobi
